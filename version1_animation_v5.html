<html lang="en">
<head>
<meta charset="UTF-8">
<title>VERSION 1 - Animated Logo v5</title>

    font-family: 'Bungee';

    font-style: normal;
  }

    background: #000;

    overflow: hidden;

  canvas { display: block; }

<body>
<canvas id="c"></canvas>
<script>
// ===== CONFIG — all tuneable parameters =====
const CONFIG = {
  global: {
    duration: 16000,
    bpm: 124,
    bgColor: '#000000',
    bgImageData: null
  },
  logos: [
    {
      id: 0,
      imageData: null,
      yPosition: 0.5,
      size: 0.82,
      fadeInTime: 960,
      fadeOutTime: 800,

      parallaxStartY: -0.3,

  pulsingLogo: {

    startTime: 10000,
    opacity: 0.85,
    maxScale: 2.0
  },
  textBoxes: [
    {
      id: 0,
      text: "DJ's moss_b & TonyT",

      fontSize: 120,
      fadeInTime: 5000,

  waveform: {
    enabled: true,
    yCenter: 0.61,
    height: 1200,
    lineWidth: 6

  bgLogos: [
    { scale: 2.2, y: 0.10, speed: 0.10, clockDir: 9, opacity: 0.30, imageData: null },
    { scale: 1.4, y: 0.22, speed: 0.16, clockDir: 3, opacity: 0.20, imageData: null },
    { scale: 0.8, y: 0.30, speed: 0.22, clockDir: 9, opacity: 0.15, imageData: null },
    { scale: 2.5, y: 0.55, speed: 0.07, clockDir: 3, opacity: 0.35, imageData: null },
    { scale: 1.0, y: 0.65, speed: 0.19, clockDir: 9, opacity: 0.18, imageData: null },
    { scale: 1.8, y: 0.78, speed: 0.13, clockDir: 3, opacity: 0.28, imageData: null },
    { scale: 0.6, y: 0.88, speed: 0.25, clockDir: 9, opacity: 0.12, imageData: null },
    { scale: 3.0, y: 0.45, speed: 0.05, clockDir: 9, opacity: 0.22, imageData: null },

  effects: {
    glitch: true,
    scanlines: true,
    grid: true,
    sweeps: true,
    cornerAccents: true,
    vignette: true
  }
};

// Listen for config updates from the editor
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'CONFIG_UPDATE') {
    Object.assign(CONFIG.global, e.data.config.global || {});
    Object.assign(CONFIG.pulsingLogo, e.data.config.pulsingLogo || {});
    Object.assign(CONFIG.spectrum, e.data.config.spectrum || {});
    Object.assign(CONFIG.waveform, e.data.config.waveform || {});
    Object.assign(CONFIG.effects, e.data.config.effects || {});
    if (e.data.config.logos) CONFIG.logos = e.data.config.logos;
    if (e.data.config.textBoxes) CONFIG.textBoxes = e.data.config.textBoxes;
    if (e.data.config.bgLogos) CONFIG.bgLogos = e.data.config.bgLogos;
    startTime = null;
  }
});

// Respond to config requests, recording, font/image loading
window.addEventListener('message', (e) => {
  if (!e.data) return;
  if (e.data.type === 'GET_CONFIG') {
    window.parent.postMessage({ type: 'CONFIG_RESPONSE', config: JSON.parse(JSON.stringify(CONFIG)) }, '*');
  }
  if (e.data.type === 'START_RECORDING') {
    startRecording(e.data.loops || 1);
  }
  if (e.data.type === 'LOAD_CUSTOM_FONT') {
    loadCustomFont(e.data.name, e.data.dataUrl);
  }
  if (e.data.type === 'LOAD_LOGO_IMAGE') {
    loadLogoImage(e.data.id, e.data.dataUrl);
  }
  if (e.data.type === 'LOAD_BG_IMAGE') {
    loadBgImage(e.data.dataUrl);
  }
  if (e.data.type === 'LOAD_BGLOGO_IMAGE') {
    loadBgLogoImage(e.data.index, e.data.dataUrl);
  }
  if (e.data.type === 'LOAD_PULSING_LOGO_IMAGE') {
    loadPulsingLogoImage(e.data.dataUrl);
  }
  if (e.data.type === 'SHOW_LABELS') {
    showLabels = true;
  }
  if (e.data.type === 'HIDE_LABELS') {
    showLabels = false;
  }
});

function loadCustomFont(name, dataUrl) {
  const font = new FontFace(name, 'url(' + dataUrl + ')');
  font.load().then((loaded) => {
    document.fonts.add(loaded);
    window.parent.postMessage({ type: 'FONT_LOADED', name }, '*');
  }).catch((err) => {
    window.parent.postMessage({ type: 'FONT_ERROR', name, error: err.message }, '*');
  });
}

// Multiple logo images keyed by logo id
const logoImages = {};
let defaultLogoLoaded = false;

function loadLogoImage(id, dataUrl) {
  const img = new Image();
  img.onload = () => {
    logoImages[id] = img;
    window.parent.postMessage({ type: 'LOGO_IMAGE_LOADED', id }, '*');
  };
  img.onerror = () => {
    window.parent.postMessage({ type: 'LOGO_IMAGE_ERROR', id }, '*');
  };
  img.src = dataUrl;
}

// Pulsing logo custom image
let pulsingLogoImg = null;
function loadPulsingLogoImage(dataUrl) {
  if (!dataUrl) { pulsingLogoImg = null; return; }
  const img = new Image();
  img.onload = () => { pulsingLogoImg = img; };
  img.src = dataUrl;
}

// Background logo images (per-bgLogo custom images)
const bgLogoImages = {};
function loadBgLogoImage(index, dataUrl) {
  if (!dataUrl) { delete bgLogoImages[index]; return; }
  const img = new Image();
  img.onload = () => { bgLogoImages[index] = img; };
  img.src = dataUrl;
}

// Background image
let bgImg = null;
function loadBgImage(dataUrl) {
  if (!dataUrl) { bgImg = null; return; }
  const img = new Image();
  img.onload = () => { bgImg = img; };
  img.src = dataUrl;
}

// Clock-face direction vectors: each maps to a unit (dx, dy) for travel direction
const CLOCK_DIRS = {
  12: { dx: 0,      dy: -1 },
  1:  { dx: 0.5,    dy: -0.866 },
  2:  { dx: 0.866,  dy: -0.5 },
  3:  { dx: 1,      dy: 0 },
  4:  { dx: 0.866,  dy: 0.5 },
  5:  { dx: 0.5,    dy: 0.866 },
  6:  { dx: 0,      dy: 1 },
  7:  { dx: -0.5,   dy: 0.866 },
  8:  { dx: -0.866, dy: 0.5 },
  9:  { dx: -1,     dy: 0 },
  10: { dx: -0.866, dy: -0.5 },
  11: { dx: -0.5,   dy: -0.866 },
};

function getLayerClockDir(layer) {
  if (layer.clockDir != null) return layer.clockDir;
  return layer.dir > 0 ? 3 : 9;
}

  CONFIG.logos.forEach(logo => {
    if (logo.imageData) loadLogoImage(logo.id, logo.imageData);

  CONFIG.bgLogos.forEach((bg, idx) => {

let showLabels = false;

function drawLabel(ctx, text, x, y) {
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.font = 'bold 28px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const pad = 10;
  const w = ctx.measureText(text).width + pad * 2;
  const h = 36;
  ctx.fillStyle = '#E8423F';
  ctx.beginPath();
  ctx.roundRect(x, y - h / 2, w, h, 6);
  ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(text, x + pad, y);
  ctx.restore();
}

let isRecording = false;
let recordingStartTime = null;
let recordingDuration = 0;

function startRecording(loops) {
  let stream;
  try {
    stream = canvas.captureStream(30);
  } catch (err) {
    window.parent.postMessage({
      type: 'RECORDING_ERROR',
      error: 'Canvas capture blocked. If using Brave, click the Shields icon in the address bar and disable Shields for this page, then try again. (' + err.message + ')'
    }, '*');
    return;
  }

  let mimeType = 'video/webm;codecs=vp9';
  let ext = 'webm';
  const tryTypes = [
    ['video/mp4;codecs=avc1', 'mp4'],
    ['video/mp4', 'mp4'],
    ['video/webm;codecs=h264', 'webm'],
    ['video/webm;codecs=vp9', 'webm'],
    ['video/webm;codecs=vp8', 'webm'],
    ['video/webm', 'webm'],
  ];
  for (const [type, e] of tryTypes) {
    if (MediaRecorder.isTypeSupported(type)) {
      mimeType = type;
      ext = e;
      break;
    }
  }

  let recorder;
  try {
    recorder = new MediaRecorder(stream, {
      mimeType,
      videoBitsPerSecond: 12000000
    });
  } catch (err) {
    window.parent.postMessage({
      type: 'RECORDING_ERROR',
      error: 'MediaRecorder failed: ' + err.message + '. Try using Chrome or Safari.'
    }, '*');
    return;
  }

  const chunks = [];
  recorder.ondataavailable = (ev) => {
    if (ev.data.size > 0) chunks.push(ev.data);
  };

  recorder.onerror = (ev) => {
    isRecording = false;
    recordingStartTime = null;
    window.parent.postMessage({
      type: 'RECORDING_ERROR',
      error: 'Recording failed: ' + (ev.error ? ev.error.message : 'unknown error')
    }, '*');
  };

  recorder.onstop = () => {
    isRecording = false;
    recordingStartTime = null;
    const blob = new Blob(chunks, { type: mimeType });
    if (blob.size === 0) {
      window.parent.postMessage({
        type: 'RECORDING_ERROR',
        error: 'Recording produced an empty file. Try using Chrome or Safari.'
      }, '*');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      window.parent.postMessage({
        type: 'RECORDING_COMPLETE',
        format: ext,
        dataUrl: reader.result,
        filename: 'version1_animation.' + ext
      }, '*');
    };
    reader.readAsDataURL(blob);
  };

  startTime = null;
  recordingDuration = CONFIG.global.duration * loops;
  isRecording = true;

  requestAnimationFrame(() => {
    recorder.start(1000);
    window.parent.postMessage({ type: 'RECORDING_STARTED', format: ext, duration: recordingDuration }, '*');

    setTimeout(() => {
      if (recorder.state === 'recording') recorder.stop();
    }, recordingDuration + 200);
  });
}

const RED = '#E8423F';
const RED_GLOW = '#FF5A57';
const WHITE = '#FFFFFF';
const GREEN = '#00FF88';
const AMBER = '#FFAA00';
const CYAN = '#00DDFF';

let startTime = null;

// --- SIMULATED AUDIO ENGINE ---
function getAudioData(time) {
  const t = time / 1000;
  const bpm = CONFIG.global.bpm;
  const beatPhase = (t * bpm / 60) % 1;
  const kick = Math.pow(Math.max(0, 1 - beatPhase * 4), 3);
  const snare = Math.pow(Math.max(0, 1 - ((beatPhase + 0.5) % 1) * 6), 2) * 0.7;

  const spectrum = [];
  for (let i = 0; i < 32; i++) {
    const freq = i / 32;
    let val = 0;
    if (i < 6) val += kick * (1 - freq * 3) * 0.9;
    if (i >= 4 && i < 12) val += (0.3 + 0.3 * Math.sin(t * 2.1 + i * 0.5)) * (snare * 0.5 + 0.4);
    if (i >= 8 && i < 20) val += (0.2 + 0.25 * Math.sin(t * 3.7 + i * 0.8)) * (0.5 + 0.3 * Math.sin(t * 1.3));
    if (i >= 16) val += (0.15 + 0.2 * Math.sin(t * 5.3 + i * 1.2)) * (0.3 + snare * 0.4);
    if (i >= 20) {
      const hhPhase = (t * bpm / 60 * 2) % 1;
      val += Math.pow(Math.max(0, 1 - hhPhase * 8), 2) * 0.35;
    }
    val += Math.random() * 0.05;
    spectrum.push(Math.min(1, Math.max(0, val)));
  }

  const waveform = [];
  for (let i = 0; i < 128; i++) {
    const phase = i / 128 * Math.PI * 2;
    let val = 0;
    val += Math.sin(phase * 2 + t * 8) * 0.3 * (0.5 + kick * 0.5);
    val += Math.sin(phase * 5 + t * 13) * 0.15;
    val += Math.sin(phase * 11 + t * 21) * 0.08;
    val += Math.sin(phase * 23 + t * 34) * 0.05;
    val += (Math.random() - 0.5) * 0.06;
    waveform.push(val);
  }

  const rmsBase = 0.35 + kick * 0.3 + snare * 0.15 + Math.sin(t * 1.7) * 0.1;
  const vuL = Math.min(1, rmsBase + Math.sin(t * 2.3) * 0.08 + Math.random() * 0.03);
  const vuR = Math.min(1, rmsBase + Math.sin(t * 2.3 + 0.5) * 0.08 + Math.random() * 0.03);

  return { spectrum, waveform, vuL, vuR, kick, beatPhase };
}

let smoothSpectrum = new Array(32).fill(0);
let smoothVuL = 0, smoothVuR = 0;
let peakVuL = 0, peakVuR = 0;
let peakDecayL = 0, peakDecayR = 0;

function updateSmoothed(audio) {
  const attack = 0.4, release = 0.08;
  for (let i = 0; i < 32; i++) {
    const target = audio.spectrum[i];
    smoothSpectrum[i] += (target > smoothSpectrum[i] ? attack : release) * (target - smoothSpectrum[i]);
  }
  const vuAttack = 0.35, vuRelease = 0.06;
  smoothVuL += (audio.vuL > smoothVuL ? vuAttack : vuRelease) * (audio.vuL - smoothVuL);
  smoothVuR += (audio.vuR > smoothVuR ? vuAttack : vuRelease) * (audio.vuR - smoothVuR);
  if (smoothVuL > peakVuL) { peakVuL = smoothVuL; peakDecayL = 0; }
  else { peakDecayL++; if (peakDecayL > 30) peakVuL -= 0.008; }
  if (smoothVuR > peakVuR) { peakVuR = smoothVuR; peakDecayR = 0; }
  else { peakDecayR++; if (peakDecayR > 30) peakVuR -= 0.008; }
}

// --- SPECTRUM ANALYSER ---
function drawSpectrumAnalyser(ctx, x, y, w, h, alpha) {
  if (alpha <= 0) return;
  ctx.save();

  const bars = CONFIG.spectrum.barCount;
  const barGap = 4;
  const barW = (w - (bars - 1) * barGap) / bars;
  const segH = 8, segGap = 3;
  const totalSegs = Math.floor(h / (segH + segGap));
  const greenSegs = Math.round(totalSegs * 0.75);
  const amberSegs = Math.round(totalSegs * 0.1875);

  for (let i = 0; i < bars; i++) {
    const specIdx = Math.floor((i / bars) * 32);
    const val = smoothSpectrum[Math.min(31, specIdx)];
    const litSegs = Math.floor(val * totalSegs);
    const bx = x + i * (barW + barGap);

    for (let s = 0; s < litSegs; s++) {
      const sy = y + h - (s + 1) * (segH + segGap);
      if (s >= greenSegs + amberSegs) ctx.fillStyle = RED;
      else if (s >= greenSegs) ctx.fillStyle = AMBER;
      else ctx.fillStyle = GREEN;
      ctx.globalAlpha = alpha * (0.75 + 0.25 * val);
      ctx.fillRect(bx, sy, barW, segH);
    }

    if (val > 0.1) {
      const peakSy = y + h - litSegs * (segH + segGap) - segH;
      ctx.fillStyle = WHITE;
      ctx.globalAlpha = alpha * 0.9;
      ctx.fillRect(bx, peakSy, barW, 3);
    }
  }

  ctx.restore();
}

// --- WAVEFORM DISPLAY (spectrum-reactive) ---
function drawWaveform(ctx, x, y, w, h, alpha, audio) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;

  const centerY = y + h / 2;
  const points = 256;
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = CYAN;
  ctx.lineWidth = CONFIG.waveform.lineWidth;
  ctx.shadowColor = CYAN;
  ctx.shadowBlur = 18;
  ctx.beginPath();
  for (let i = 0; i < points; i++) {
    const px = x + (i / points) * w;
    const specIdx = Math.floor((i / points) * 32);
    const specVal = smoothSpectrum[Math.min(31, specIdx)];
    const nextVal = smoothSpectrum[Math.min(31, specIdx + 1)];
    const frac = ((i / points) * 32) - specIdx;
    const blended = specVal + (nextVal - specVal) * frac;
    const wave = Math.sin(i * Math.PI * 2 / (points / 8) + audio.waveform[i % 128] * 4);
    const py = centerY + wave * blended * h * 0.48;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.globalAlpha = alpha * 0.1;
  ctx.fillStyle = CYAN;
  ctx.lineTo(x + w, centerY);
  ctx.lineTo(x, centerY);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// --- TEXT BOX (supports \n for line breaks, optional border) ---
function drawTextBox(ctx, alpha, tb) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;

  const lines = tb.text.split('\\n');
  const y = H * tb.yPosition;
  const fontSize = tb.fontSize;
  const lineHeight = fontSize * 1.3;

  ctx.font = 'bold ' + fontSize + 'px ' + tb.fontFamily;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.letterSpacing = Math.round(fontSize * 0.06) + 'px';

  if (tb.border) {
    const padX = tb.paddingX || 40;
    const padY = tb.paddingY || 20;
    const borderW = tb.borderWidth || 3;
    const radius = tb.cornerRadius || 12;

    let maxWidth = 0;
    for (const line of lines) {
      const w = ctx.measureText(line).width;
      if (w > maxWidth) maxWidth = w;
    }

    const boxW = maxWidth + padX * 2;
    const boxH = lineHeight * lines.length + padY * 2 - (lineHeight - fontSize);
    const boxX = (W - boxW) / 2;
    const boxY = y - boxH / 2;

    ctx.strokeStyle = tb.borderColor || RED;
    ctx.lineWidth = borderW;
    ctx.beginPath();
    ctx.roundRect(boxX, boxY, boxW, boxH, radius);
    ctx.stroke();
  }

  ctx.fillStyle = tb.textColor || WHITE;
  const textBlockTop = y - ((lines.length - 1) * lineHeight) / 2;
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], W / 2, textBlockTop + i * lineHeight);
  }

  ctx.restore();
}

// --- PARTICLES ---
class Particle {
  constructor(x, y, color, speed, size, life) {
    this.x = x; this.y = y; this.color = color;
    this.vx = (Math.random() - 0.5) * speed;
    this.vy = (Math.random() - 0.5) * speed;
    this.size = size; this.life = life; this.maxLife = life; this.decay = 0.97;
  }
  update() { this.x += this.vx; this.y += this.vy; this.vx *= this.decay; this.vy *= this.decay; this.life--; }
  draw(ctx) {
    ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
    ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = this.size * 3;
    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
}
let particles = [];
function spawnParticles(x, y, count, color, speed, size, life) {
  for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color, speed||4, size||3, life||60));
}

// --- EFFECTS ---
function drawScanlines(ctx, intensity) {
  ctx.globalAlpha = intensity * 0.12;
  for (let y = 0; y < H; y += 4) { ctx.fillStyle = '#000'; ctx.fillRect(0, y, W, 2); }
  ctx.globalAlpha = 1;
}

function glitchSlice(ctx, intensity) {
  const slices = Math.floor(3 + Math.random() * 8 * intensity);
  for (let i = 0; i < slices; i++) {
    const y = Math.floor(Math.random() * H), h = Math.floor(5 + Math.random() * 40 * intensity);
    const offset = Math.floor((Math.random() - 0.5) * 60 * intensity);
    try { const d = ctx.getImageData(0, y, W, h); ctx.putImageData(d, offset, y); } catch(e) {}
  }
}

function rgbSplit(ctx, intensity) {
  const offset = Math.floor(intensity * 8);
  try {
    const imgData = ctx.getImageData(0, 0, W, H); const data = imgData.data;
    const copy = new Uint8ClampedArray(data);
    for (let i = 0; i < data.length; i += 4) {
      const x = (i/4) % W;
      if (x + offset < W) data[i] = copy[i + offset * 4];
      if (x - offset >= 0) data[i + 2] = copy[i - offset * 4 + 2];
    }
    ctx.putImageData(imgData, 0, 0);
  } catch(e) {}
}

function noiseRect(ctx, intensity) {
  const count = Math.floor(intensity * 12);
  for (let i = 0; i < count; i++) {
    ctx.globalAlpha = 0.3 + Math.random() * 0.5;
    ctx.fillStyle = Math.random() > 0.5 ? RED : WHITE;
    ctx.fillRect(Math.random()*W, Math.random()*H, 20+Math.random()*100*intensity, 2+Math.random()*8);
  }
  ctx.globalAlpha = 1;
}

function drawGrid(ctx, time, intensity) {
  if (intensity <= 0) return;
  ctx.save(); ctx.globalAlpha = intensity * 0.06; ctx.strokeStyle = RED; ctx.lineWidth = 1;
  const sp = 60, off = Math.sin(time/1000) * 10;
  for (let x = off; x < W; x += sp) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = off; y < H; y += sp) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.restore();
}

function drawSweep(ctx, progress, y, height) {
  if (progress < 0 || progress > 1) return;
  const sx = -200 + (W + 400) * progress;
  const grad = ctx.createLinearGradient(sx-200, 0, sx+200, 0);
  grad.addColorStop(0, 'rgba(255,255,255,0)');
  grad.addColorStop(0.4, 'rgba(255,255,255,0.08)');
  grad.addColorStop(0.5, 'rgba(255,255,255,0.2)');
  grad.addColorStop(0.6, 'rgba(255,255,255,0.08)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, y-height/2, W, height);
}

function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10*t); }
function easeOutBack(t) { const c = 1.7; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

// --- MAIN RENDER ---
function render(timestamp) {
  if (!startTime) startTime = timestamp;
  const TOTAL_DURATION = CONFIG.global.duration;
  const elapsed = (timestamp - startTime) % TOTAL_DURATION;
  const t = elapsed / TOTAL_DURATION;

  const audio = getAudioData(timestamp - (startTime || 0));
  updateSmoothed(audio);

  if (t < 0.02) particles = [];

  // Background colour
  ctx.fillStyle = CONFIG.global.bgColor || '#000000';
  ctx.fillRect(0, 0, W, H);

  // Background image (cover-fit, centred)
  if (bgImg) {
    const imgAspect = bgImg.naturalWidth / bgImg.naturalHeight;
    const canvasAspect = W / H;
    let drawW, drawH, drawX, drawY;
    if (imgAspect > canvasAspect) {
      drawH = H;
      drawW = H * imgAspect;
      drawX = (W - drawW) / 2;
      drawY = 0;
    } else {
      drawW = W;
      drawH = W / imgAspect;
      drawX = 0;
      drawY = (H - drawH) / 2;
    }
    ctx.drawImage(bgImg, drawX, drawY, drawW, drawH);
  }

  // Use first logo for parallax reference
  const primaryLogo = CONFIG.logos[0] || CONFIG.logos[0];
  const pxDur = primaryLogo ? primaryLogo.parallaxDuration : 3000;

  // Master fade envelope
  const fadeIn = 0.05, fadeOut = 0.05;
  let masterAlpha = 1;
  if (t < fadeIn) masterAlpha = t / fadeIn;
  else if (t > 1.0 - fadeOut) masterAlpha = (1.0 - t) / fadeOut;

  // Instrument fade
  let instrAlpha = 0;
  if (t > 0.04 && t < 0.96) {
    instrAlpha = t < 0.10 ? (t - 0.04) / 0.06 : (t > 0.90 ? (0.96 - t) / 0.06 : 1);
  }
  instrAlpha *= masterAlpha;

  // Grid
  if (CONFIG.effects.grid) {
    let gridI = 0;
    if (t > 0.01 && t < 0.95) gridI = t < 0.06 ? (t-0.01)/0.05 : (t > 0.88 ? (0.95-t)/0.07 : 1);
    drawGrid(ctx, elapsed, gridI * 0.6 * masterAlpha);
  }

  // --- SCROLLING BACKGROUND LOGOS ---
  let bgFade = 1;
  if (t < 0.05) bgFade = t / 0.05;
  else if (t > 0.93) bgFade = Math.max(0, (1.0 - t) / 0.07);

  if (bgFade > 0) {
    for (let li = 0; li < CONFIG.bgLogos.length; li++) {
      const layer = CONFIG.bgLogos[li];
      const layerImg = bgLogoImages[li] || (defaultLogoLoaded ? defaultLogoImg : null);
      if (!layerImg) continue;

      const bgAspect = layerImg.naturalWidth / layerImg.naturalHeight;
      const lW = W * layer.scale;
      const lH = lW / bgAspect;
      const scrollLenX = lW + W;
      const scrollLenY = lH + H;

      const cd = getLayerClockDir(layer);
      const dir = CLOCK_DIRS[cd] || CLOCK_DIRS[9];
      const isVertical = cd === 12 || cd === 6;
      const isHorizontal = cd === 3 || cd === 9;

      let baseY = isVertical ? H * 0.5 : H * layer.y;
      let baseX = isVertical ? W * layer.y : W * 0.5;

      if (!isVertical && primaryLogo && primaryLogo.parallax) {
        const parallaxRate = 0.3 + layer.speed * 2;
        const layerShift = H * 0.15 * parallaxRate;
        if (elapsed < pxDur) {
          const pProgress = easeOutCubic(elapsed / pxDur);
          baseY = (H * layer.y - layerShift) + layerShift * pProgress;
        } else if (elapsed > TOTAL_DURATION - pxDur) {
          const pProgress = easeOutCubic((TOTAL_DURATION - elapsed) / pxDur);
          baseY = (H * layer.y - layerShift) + layerShift * pProgress;
        }
      }

      ctx.save();
      ctx.globalAlpha = layer.opacity * bgFade;

      if (isHorizontal) {
        const px = dir.dx > 0
          ? -lW + ((elapsed * layer.speed) % scrollLenX)
          : W - ((elapsed * layer.speed) % scrollLenX);
        const py = baseY - lH / 2;
        ctx.drawImage(layerImg, px, py, lW, lH);
        ctx.drawImage(layerImg, px - dir.dx * scrollLenX, py, lW, lH);
      } else if (isVertical) {
        const px = baseX - lW / 2;
        const py = dir.dy > 0
          ? -lH + ((elapsed * layer.speed) % scrollLenY)
          : H - ((elapsed * layer.speed) % scrollLenY);
        ctx.drawImage(layerImg, px, py, lW, lH);
        ctx.drawImage(layerImg, px, py - dir.dy * scrollLenY, lW, lH);
      } else {
        const speedX = layer.speed * Math.abs(dir.dx);
        const speedY = layer.speed * Math.abs(dir.dy);
        const rawPx = dir.dx > 0
          ? -lW + ((elapsed * speedX) % scrollLenX)
          : W - ((elapsed * speedX) % scrollLenX);
        const rawPy = dir.dy > 0
          ? -lH + ((elapsed * speedY) % scrollLenY)
          : H - ((elapsed * speedY) % scrollLenY);
        const offX = dir.dx > 0 ? -scrollLenX : scrollLenX;
        const offY = dir.dy > 0 ? -scrollLenY : scrollLenY;
        ctx.drawImage(layerImg, rawPx, rawPy, lW, lH);
        ctx.drawImage(layerImg, rawPx + offX, rawPy, lW, lH);
        ctx.drawImage(layerImg, rawPx, rawPy + offY, lW, lH);
        ctx.drawImage(layerImg, rawPx + offX, rawPy + offY, lW, lH);
      }

      ctx.restore();
    }
  }

  // Light sweeps (use first logo Y for reference)
  const primaryLogoY = primaryLogo ? H * primaryLogo.yPosition : H * 0.5;
  if (CONFIG.effects.sweeps) {
    if (t > 0.10 && t < 0.20) drawSweep(ctx, (t - 0.10) / 0.10, primaryLogoY, 200);
    if (t > 0.45 && t < 0.55) drawSweep(ctx, (t - 0.45) / 0.10, primaryLogoY, 150);
    if (t > 0.70 && t < 0.78) drawSweep(ctx, (t - 0.70) / 0.08, primaryLogoY, 150);
  }

  // Glitch
  if (CONFIG.effects.glitch && masterAlpha > 0.1) {
    let gI = 0;
    if (t > 0.06 && t < 0.12) gI = 0.8 * (1 - (t - 0.06) / 0.06);
    if (t > 0.15 && t < 0.20) gI = Math.max(gI, 0.7 * (1 - (t - 0.15) / 0.05));
    if (t > 0.25 && t < 0.85 && Math.sin(elapsed * 0.017) > 0.97) gI = 0.3;
    if (t > 0.88 && t < 0.94) gI = Math.max(gI, 0.8 * ((t - 0.88) / 0.06));
    gI *= masterAlpha;
    if (gI > 0.1) { glitchSlice(ctx, gI); rgbSplit(ctx, gI * 0.8); }
    if (gI > 0.3) noiseRect(ctx, gI * 0.6);
  }

  // Scanlines
  if (CONFIG.effects.scanlines) {
    drawScanlines(ctx, 0.4 * masterAlpha);
  }

  // Particles
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => { p.update(); p.draw(ctx); });

  // Corner accents
  if (CONFIG.effects.cornerAccents && t > 0.08 && t < 0.94) {
    const cA = (t < 0.14 ? (t - 0.08) / 0.06 : (t > 0.88 ? (0.94 - t) / 0.06 : 1)) * masterAlpha;
    ctx.save(); ctx.globalAlpha = cA * 0.3; ctx.strokeStyle = RED; ctx.lineWidth = 2;
    const m = 40, l = 60;
    ctx.beginPath(); ctx.moveTo(m, m+l); ctx.lineTo(m, m); ctx.lineTo(m+l, m); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-m-l, m); ctx.lineTo(W-m, m); ctx.lineTo(W-m, m+l); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(m, H-m-l); ctx.lineTo(m, H-m); ctx.lineTo(m+l, H-m); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-m-l, H-m); ctx.lineTo(W-m, H-m); ctx.lineTo(W-m, H-m-l); ctx.stroke();
    ctx.restore();
  }

  // Vignette
  if (CONFIG.effects.vignette) {
    const vignetteStrength = 0.55 + (1 - masterAlpha) * 0.45;
    const vG = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.8);
    vG.addColorStop(0, 'rgba(0,0,0,0)');
    vG.addColorStop(1, 'rgba(0,0,0,' + vignetteStrength + ')');
    ctx.fillStyle = vG; ctx.fillRect(0, 0, W, H);
  }

  // --- LOGOS (iterate over all, each with own parallax/fade) ---
  for (let li = 0; li < CONFIG.logos.length; li++) {
    const logo = CONFIG.logos[li];
    const logoImg = getLogoImage(logo);
    const logoReady = isLogoReady(logo);

    // Parallax position
    let logoY;
    const logoPxDur = logo.parallaxDuration || 3000;
    const logoStartY = H * (logo.parallaxStartY ?? -0.3);
    const logoEndY = H * logo.yPosition;
    if (logo.parallax && elapsed < logoPxDur) {
      const pProgress = easeOutCubic(elapsed / logoPxDur);
      logoY = logoStartY + (logoEndY - logoStartY) * pProgress;
    } else if (logo.parallax && elapsed > TOTAL_DURATION - logoPxDur) {
      const pProgress = easeOutCubic((TOTAL_DURATION - elapsed) / logoPxDur);
      logoY = logoStartY + (logoEndY - logoStartY) * pProgress;
    } else {
      logoY = logoEndY;
    }

    // Alpha
    const fadeInNorm = (logo.fadeInTime || 960) / TOTAL_DURATION;
    const fadeOutNorm = (logo.fadeOutTime || 800) / TOTAL_DURATION;
    const logoFadeOutStart = 1.0 - fadeOutNorm - 0.04;
    let logoAlpha = 0;
    if (t >= 0.04 && t < (1.0 - 0.04)) {
      const rT = Math.min(1, (t - 0.04) / fadeInNorm);
      logoAlpha = easeOutExpo(rT);
      if (t > logoFadeOutStart) logoAlpha *= Math.max(0, ((1.0 - 0.04) - t) / fadeOutNorm);
    }
    logoAlpha *= masterAlpha;

    if (!logoReady || logoAlpha <= 0) continue;

    const targetW = W * logo.size;
    const aspect = logoImg.naturalWidth / logoImg.naturalHeight;
    const drawW = targetW;
    const drawH = drawW / aspect;

    // Pulsing ghost (only for first logo)
    if (li === 0 && CONFIG.pulsingLogo.enabled && logoAlpha > 0
        && elapsed > CONFIG.pulsingLogo.startTime && elapsed < TOTAL_DURATION - logoPxDur) {
      const pulseEndTime = TOTAL_DURATION - logoPxDur;
      const beatDuration = 60 / CONFIG.global.bpm;
      const totalTime = (timestamp - (startTime || 0)) / 1000;
      const beatPhase = (totalTime / beatDuration) % 1;
      const pulseScale = 1 + beatPhase * (CONFIG.pulsingLogo.maxScale - 1);
      let pulseFade = 1;
      if (elapsed > pulseEndTime - 2000) pulseFade = Math.max(0, (pulseEndTime - elapsed) / 2000);
      const pulseAlpha = logoAlpha * CONFIG.pulsingLogo.opacity * Math.pow(1 - beatPhase, 1.5) * pulseFade;

      if (pulseAlpha > 0.01) {
        const pulseImg = pulsingLogoImg || logoImg;
        const pulseAspect = pulseImg.naturalWidth / pulseImg.naturalHeight;
        const pDrawW = pulsingLogoImg ? targetW : drawW;
        const pDrawH = pulsingLogoImg ? pDrawW / pulseAspect : drawH;
        ctx.save();
        ctx.translate(W / 2, H * CONFIG.pulsingLogo.yPosition);
        ctx.scale(pulseScale, pulseScale);
        ctx.globalAlpha = pulseAlpha;
        ctx.drawImage(pulseImg, -pDrawW / 2, -pDrawH / 2, pDrawW, pDrawH);
        ctx.restore();
      }
    }

    // Spectrum (drawn before first logo only)
    if (li === 0 && CONFIG.spectrum.enabled !== false) {
      const specH = CONFIG.spectrum.height;
      const specX = 30, specW = W - 60;
      const specY = H - specH - CONFIG.spectrum.bottomOffset;
      drawSpectrumAnalyser(ctx, specX, specY, specW, specH, instrAlpha * 0.9);
    }

    // Solid logo
    ctx.save();
    ctx.translate(W / 2, logoY);
    ctx.globalAlpha = logoAlpha;
    ctx.drawImage(logoImg, -drawW / 2, -drawH / 2, drawW, drawH);
    ctx.restore();
  }

  // If no logos exist, still draw spectrum
  if (CONFIG.logos.length === 0 && CONFIG.spectrum.enabled !== false) {
    const specH = CONFIG.spectrum.height;
    const specX = 30, specW = W - 60;
    const specY = H - specH - CONFIG.spectrum.bottomOffset;
    drawSpectrumAnalyser(ctx, specX, specY, specW, specH, instrAlpha * 0.9);
  }

  // --- TEXT BOXES (unified loop) ---
  for (const tb of CONFIG.textBoxes) {
    if (elapsed >= tb.fadeInTime) {
      const tbFadeStart = tb.fadeInTime / TOTAL_DURATION;
      const tbFadeDur = 1500 / TOTAL_DURATION;
      const tbFadeOutStart = 1.0 - tbFadeDur - 0.04;
      let tbAlpha = Math.min(1, (t - tbFadeStart) / tbFadeDur);
      if (t > tbFadeOutStart) tbAlpha *= Math.max(0, ((1.0 - 0.04) - t) / tbFadeDur);
      drawTextBox(ctx, tbAlpha, tb);
    }
  }

  // --- WAVEFORM (top layer) ---
  if (CONFIG.waveform.enabled !== false) {
    const waveH = CONFIG.waveform.height;
    const waveX = 30, waveY = H * CONFIG.waveform.yCenter - waveH / 2, waveW = W - 60;
    drawWaveform(ctx, waveX, waveY, waveW, waveH, instrAlpha * 0.85, audio);
  }

  // --- ELEMENT LABELS (debug overlay) ---
  if (showLabels) {
    const pxDurL = primaryLogo ? (primaryLogo.parallaxDuration || 3000) : 3000;

    for (let i = 0; i < CONFIG.bgLogos.length; i++) {
      const layer = CONFIG.bgLogos[i];
      const cd = getLayerClockDir(layer);
      const dir = CLOCK_DIRS[cd] || CLOCK_DIRS[9];
      const isVertical = cd === 12 || cd === 6;
      const isHorizontal = cd === 3 || cd === 9;

      const layerImg = bgLogoImages[i] || defaultLogoImg;
      const bgAspect = layerImg.naturalWidth / layerImg.naturalHeight;
      const lW = W * layer.scale;
      const lH = lW / bgAspect;
      const scrollLenX = lW + W;
      const scrollLenY = lH + H;

      let lx, ly;
      if (isHorizontal) {
        ly = H * layer.y;
        if (primaryLogo && primaryLogo.parallax) {
          const parallaxRate = 0.3 + layer.speed * 2;
          const layerShift = H * 0.15 * parallaxRate;
          if (elapsed < pxDurL) {
            ly = (H * layer.y - layerShift) + layerShift * easeOutCubic(elapsed / pxDurL);
          } else if (elapsed > TOTAL_DURATION - pxDurL) {
            ly = (H * layer.y - layerShift) + layerShift * easeOutCubic((TOTAL_DURATION - elapsed) / pxDurL);
          }
        }
        lx = dir.dx > 0
          ? -lW + ((elapsed * layer.speed) % scrollLenX)
          : W - ((elapsed * layer.speed) % scrollLenX);
      } else if (isVertical) {
        lx = W * layer.y - lW / 2;
        ly = dir.dy > 0
          ? -lH + ((elapsed * layer.speed) % scrollLenY)
          : H - ((elapsed * layer.speed) % scrollLenY);
      } else {
        const speedX = layer.speed * Math.abs(dir.dx);
        const speedY = layer.speed * Math.abs(dir.dy);
        lx = dir.dx > 0
          ? -lW + ((elapsed * speedX) % scrollLenX)
          : W - ((elapsed * speedX) % scrollLenX);
        ly = H * layer.y;
        if (primaryLogo && primaryLogo.parallax) {
          const parallaxRate = 0.3 + layer.speed * 2;
          const layerShift = H * 0.15 * parallaxRate;
          if (elapsed < pxDurL) {
            ly = (H * layer.y - layerShift) + layerShift * easeOutCubic(elapsed / pxDurL);
          } else if (elapsed > TOTAL_DURATION - pxDurL) {
            ly = (H * layer.y - layerShift) + layerShift * easeOutCubic((TOTAL_DURATION - elapsed) / pxDurL);
          }
        }
      }
      drawLabel(ctx, 'BG ' + (i + 1), Math.max(4, lx), ly);
    }

    for (let i = 0; i < CONFIG.logos.length; i++) {
      const logo = CONFIG.logos[i];
      const logoPxDur = logo.parallaxDuration || 3000;
      const logoStartY = H * (logo.parallaxStartY ?? -0.3);
      const logoEndY = H * logo.yPosition;
      let ly;
      if (logo.parallax && elapsed < logoPxDur) {
        ly = logoStartY + (logoEndY - logoStartY) * easeOutCubic(elapsed / logoPxDur);
      } else if (logo.parallax && elapsed > TOTAL_DURATION - logoPxDur) {
        ly = logoStartY + (logoEndY - logoStartY) * easeOutCubic((TOTAL_DURATION - elapsed) / logoPxDur);
      } else {
        ly = logoEndY;
      }
      drawLabel(ctx, 'Logo ' + (i + 1), 20, ly);
    }

    for (let i = 0; i < CONFIG.textBoxes.length; i++) {
      drawLabel(ctx, 'Text ' + (i + 1), 20, H * CONFIG.textBoxes[i].yPosition);
    }

    if (CONFIG.spectrum.enabled !== false) {
      drawLabel(ctx, 'Spectrum', 20, H - CONFIG.spectrum.height / 2 - CONFIG.spectrum.bottomOffset);
    }
    if (CONFIG.waveform.enabled !== false) {
      drawLabel(ctx, 'Waveform', 20, H * CONFIG.waveform.yCenter);
    }
    if (CONFIG.pulsingLogo.enabled) {
      drawLabel(ctx, 'Pulsing', W - 180, H * CONFIG.pulsingLogo.yPosition);
    }
  }

  // Recording progress
  if (isRecording && startTime) {
    const recElapsed = timestamp - startTime;
    const progress = Math.min(1, recElapsed / recordingDuration);
    window.parent.postMessage({ type: 'RECORDING_PROGRESS', progress }, '*');
  }

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
